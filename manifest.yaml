apiVersion: v1  # 请勿修改
kind: Plugin  # 请勿修改
metadata:
  # author 和 name 唯一确定一个插件
  author: Amateur
  name: BilibiliReminder
  repository: 'https://github.com/DefensiveSniper/BilibiliReminder'
  version: 0.2.0
  description:
    en_US: 'Subscribe to Bilibili streamers and get notified in chat when they go live'
    zh_Hans: '订阅B站UP主的开播状态信息'
  label:
    en_US: BilibiliReminder
    zh_Hans: BilibiliReminder
  icon: assets/icon.svg
spec:
  config:
    - name: check_interval
      type: integer
      label:
        en_US: Check interval (seconds)
        zh_Hans: 查询间隔（秒）
      description:
        en_US: 'How often to poll Bilibili for live status. Values below 15 seconds are clamped to 15.'
        zh_Hans: '轮询B站直播间状态的间隔，单位为秒。小于 15 秒会被强制为 15 秒。'
      default: 60
      required: false
    - name: default_cover
      type: string
      label:
        en_US: Fallback cover image
        zh_Hans: 兜底封面图
      description:
        en_US: 'Image used in the notification when the streamer has not set a cover.'
        zh_Hans: 'UP主没有设置直播间封面时，提醒消息里使用的图片。'
      default: 'https://hzihao.icu/wp-content/uploads/2025/07/cover1_compressed.png'
      required: false
    - name: notify_admin
      type: boolean
      label:
        en_US: Notify admin on failure
        zh_Hans: 出错时通知管理员
      description:
        en_US: 'Send a private message to the admin when pushing a reminder fails.'
        zh_Hans: '推送开播提醒失败时，私聊通知管理员。'
      default: false
      required: false
    - name: admin_id
      type: string
      label:
        en_US: Admin user ID
        zh_Hans: 管理员账号 ID
      description:
        en_US: 'The user ID that receives failure notifications, e.g. the admin QQ number.'
        zh_Hans: '接收异常通知的账号 ID，例如机器人管理员的 QQ 号。'
      default: ''
      required: false
      show_if:
        field: notify_admin
        operator: eq
        value: true
  components:
    Command:
      fromDirs:
        - path: components/commands/
    EventListener:
      fromDirs:
        - path: components/event_listener/
execution:
  python:
    path: main.py  # 请勿修改
    attr: BilibiliReminder  # 请勿修改
